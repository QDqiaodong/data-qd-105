[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-105"
version = "0.1.0"
description = "Reproducible domain data engineering baseline"
requires-python = ">=3.11"
dependencies = ["shapely==2.1.2", "numpy==2.2.6"]

[tool.setuptools.packages.find]
include = ["landcover_cube*"]
